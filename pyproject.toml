[project]
name = "americast"
version = "0.1.0"
description = "Statewide day-ahead solar generation forecast for the California grid (CAISO)"
readme = "README.md"
authors = [
    { name = "hoodsy", email = "bernard.logan4@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cfgrib>=0.9.15.1",
    "duckdb>=1.5.5",
    "gridstatus>=0.36.0",
    "herbie-data>=2026.3.0",
    "lightgbm>=4.7.0",
    "pandas>=2.3.3",
    "plotly>=6.9.0",
    "pvlib>=0.15.2",
    "pyarrow>=25.0.0",
    "scikit-learn>=1.9.0",
    "xarray>=2026.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # pandas 2.3.3 internals vs numpy 2.5; fixed in pandas 3 (blocked by gridstatus)
    "ignore:The 'generic' unit for NumPy timedelta:DeprecationWarning",
]
