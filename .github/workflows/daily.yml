name: daily

# 09:00 UTC is 06z plus three hours: the HRRR archive needs about
# ninety minutes to finish uploading a run, and `run_daily.latest`
# refuses anything younger than two. Firing earlier would fetch a
# half-written run and publish a forecast with holes in it.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

# One at a time. Two overlapping runs would both read a store, both
# append, and the second write would drop the first one's rows. S3 has
# no transactions, so this is the only thing preventing that.
concurrency:
  group: daily
  cancel-in-progress: false

# Every store resolves against this root, so the job reads the registry,
# the model and the labels straight out of the bucket and writes the
# forecasts back to it. Nothing durable touches the runner's disk, which
# is why there is no cache step here: caches are evicted after seven
# days and the scoreboard is meant to accumulate for years.
env:
  AMERICAST_DATA_ROOT: ${{ vars.AMERICAST_DATA_ROOT }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The bucket credentials live in this environment, not on the repo.
    # Without naming it here every secret and variable below resolves to
    # an empty string, which is how this first ran: four blank values and
    # a job that got as far as the configuration guard.
    environment: americast-env
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync

      - name: Check the bucket is configured
        run: |
          test -n "$AMERICAST_DATA_ROOT" || {
            echo "AMERICAST_DATA_ROOT is unset; set it as a repository variable"
            exit 1
          }
          echo "writing to $AMERICAST_DATA_ROOT"

      # Yesterday's actuals, so grading has something to score.
      - name: Fetch labels
        run: uv run python -m americast.ingest.caiso

      # Fetches one HRRR run into memory; nothing is stored locally.
      - name: Forecast
        run: uv run python -m americast.daily.run_daily

      - name: Grade
        run: uv run python -m americast.daily.grade_daily

      # A copy of the two public objects, kept for 90 days. The bucket
      # is the source of truth; this exists so a bad morning can be
      # inspected without bucket access.
      - name: Upload contract
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forecast-json
          path: |
            data/public/forecast.json
            data/public/scoreboard.json
          retention-days: 90
          if-no-files-found: ignore
